name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a production migration when another merge arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    name: Migrations on a fresh DB + DB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh local stack; `supabase start` applies every migration in
      # supabase/migrations (→ db/migrations) to an empty database.
      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta
      - name: Re-apply migrations from scratch
        run: pnpm exec supabase db reset
      - name: Lint database schema
        run: pnpm exec supabase db lint --level warning --fail-on error
      - name: Seed exercise library
        run: pnpm seed:exercises
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: DB tests (RLS, constraints, seed idempotency, schema drift)
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: End-to-end (Playwright, phone viewport)
    # Playwright 1.60 supports up to Ubuntu 24.04 (ubuntu-latest is newer).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta,realtime,storage-api,edge-runtime
      - name: Seed exercise library
        run: pnpm seed:exercises
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Export local Supabase URL and keys
        run: |
          pnpm exec supabase status -o json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const j = JSON.parse(s.slice(s.indexOf("{")));
              const out = {
                NEXT_PUBLIC_SUPABASE_URL: j.API_URL,
                NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: j.PUBLISHABLE_KEY ?? j.ANON_KEY,
                SUPABASE_SERVICE_ROLE_KEY: j.SERVICE_ROLE_KEY ?? j.SECRET_KEY,
              };
              for (const [k, v] of Object.entries(out)) {
                if (!v) throw new Error(`missing ${k}`);
                console.log(`::add-mask::${v}`);
                require("fs").appendFileSync(process.env.GITHUB_ENV, `${k}=${v}\n`);
              }
            });'
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - if: always()
        run: pnpm exec supabase stop --no-backup

  production-migrations:
    name: Apply production database migrations
    needs: [checks, database, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-database-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: sxixvveiwkuucxuyrpgm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check production credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret for production migrations."
            exit 1
          fi
      - name: Preview pending migrations
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --dry-run
      - name: Apply pending migrations
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --yes
      - name: Show production migration history
        run: pnpm exec supabase migration list --remote="$SUPABASE_PROJECT_REF"
