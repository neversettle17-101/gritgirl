<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week ledger – with cycle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#FFE27A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2B59C3; font-family: 'JetBrains Mono', monospace; color: #1B1B1B; padding: 52px 20px 0">

<div style="display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.06em">
<span>23 – 29 NOV</span><span>STATEMENT</span>
</div>
<h1 style="margin: 10px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; letter-spacing: -0.02em; color: #fff">Weekly<br>statement</h1>

<div style="position: relative; margin-top: 20px; transform: rotate(0.8deg)">
<div style="background: #FFFDF8; padding: 16px 18px; font-size: 13px; box-shadow: 0 12px 30px rgba(0,0,0,0.25)">
<div style="display: grid; grid-template-columns: 44px 1fr 56px; gap: 8px; font-size: 11px; color: #555; font-weight: 600; padding-bottom: 6px; border-bottom: 2px dashed #1B1B1B"><span>DAY</span><span>ITEMS</span><span style="text-align: right">MIN</span></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="position: relative; display: grid; grid-template-columns: 44px 1fr 56px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dotted #BBB">
<sc-if value="{{d.period}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; left: -10px; top: -3px; width: calc(100% + 20px); height: calc(100% + 6px); overflow: visible"><path d="M6 54 C4 22 30 8 60 10 C88 12 99 30 96 58 C92 88 56 96 26 90 C6 86 1 64 12 34" fill="none" stroke="#C8102E" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round"></path></svg>
</sc-if>
<span style="font-weight: 800">{{d.label}}</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px">{{d.items}}</span>
<sc-if value="{{d.period}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 4px; color: #C8102E; font-size: 10px; font-weight: 800"><svg width="9" height="11" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1C9 7 4 11 4 17a8 8 0 0 0 16 0c0-6-5-10-8-16z" fill="#C8102E"></path></svg>BLOOD BANK DOWN · {{d.pday}}</span></sc-if>
<span style="display: flex; height: 6px; gap: 2px">
<sc-for list="{{d.segs}}" as="s" hint-placeholder-count="1"><span style="width: {{s.w}}; background: {{s.c}}"></span></sc-for>
</span>
</span>
<span style="text-align: right; font-weight: 800">{{d.min}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; margin-top: 12px"><span>WEEK TOTAL</span><span>{{total}} MIN</span></div>
<div style="display: flex; gap: 12px; font-size: 11px; margin-top: 10px; color: #333; flex-wrap: wrap">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 6px; background: #1B1B1B"></span>RUN</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 6px; background: #E0412B"></span>STRENGTH</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 14px; height: 6px; background: repeating-linear-gradient(90deg,#1B1B1B 0 2px,transparent 2px 4px)"></span>WALK</span>
<span style="display: flex; align-items: center; gap: 5px; color: #C8102E; font-weight: 800"><span style="width: 14px; height: 10px; border: 2px solid #C8102E; border-radius: 50%; box-sizing: border-box"></span>PERIOD</span>
</div>
</div>

</div>

<nav aria-label="Main" style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; letter-spacing: 0.08em">
<a href="RcptHome.dc.html" style="text-decoration: none; padding: 12px 8px">HOME</a>
<a href="RcptDay.dc.html" style="text-decoration: none; padding: 12px 8px">DAY</a>
<a href="CycWeek.dc.html" aria-current="page" style="text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 3px; padding: 12px 8px">WEEK</a>
<a href="CycMonth.dc.html" style="text-decoration: none; padding: 12px 8px">MONTH</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var C = { r: '#1B1B1B', l: '#E0412B', w: 'repeating-linear-gradient(90deg,#1B1B1B 0 2px,transparent 2px 4px)' };
var N = { r: 'RUN', l: 'STRENGTH', w: 'WALK' };
var raw = [
['MON', [['r', 28]]], ['TUE', [['l', 40], ['w', 35]], 'DAY 1'], ['WED', [], 'DAY 2'], ['THU', [['r', 33]]],
['FRI', [['l', 45]]], ['SAT', [['r', 31], ['l', 43]]], ['SUN', null]
];
var total = 0;
var days = raw.map(function (d) {
var base = { label: d[0], period: !!d[2], pday: d[2] || '' };
if (d[1] === null) return Object.assign(base, { items: 'NOT YET RUNG UP', segs: [], min: '—' });
if (!d[1].length) return Object.assign(base, { items: 'REST DAY · NO CHARGE', segs: [], min: '0' });
var m = 0;
var segs = d[1].map(function (x) { m += x[1]; return { w: (x[1] * 1.6) + 'px', c: C[x[0]] }; });
total += m;
return Object.assign(base, { items: d[1].map(function (x) { return N[x[0]]; }).join(' + '), segs: segs, min: String(m) });
});
return { days: days, total: total };
}
}
</script>
</body>
</html>
